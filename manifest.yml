name: Paint Board
package: lazycat.community.app.paint-board
version: 1.5.7
min_os_version: 1.3.8
description: "🎨 A powerful multi-end drawing board that brings together a lot of creative brushes to experience a whole new range of drawing effects!"
homepage: https://github.com/LHRUN/paint-board
author: LHRUN
application:
    subdomain: paint-board
    background_task: true
    public_path:
        - /
    upstreams:
        - location: /
          backend: http://paint-board

services:
    paint-board:
        # ghcr.io/fc6a1b03/paint-board:1.5.7
        image: xget.xi-xu.me/cr/ghcr/fc6a1b03/paint-board:1.5.7
