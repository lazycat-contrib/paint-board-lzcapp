version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/paint-board.lpk

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: paint-board

build:
  run_buildscript: false

images:
  - id: paint-board
    target: service
    service: paint-board
    source: ghcr.io/fc6a1b03/paint-board
    channel: stable
    tag_regex: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: mirror
      image_template: xget.xi-xu.me/cr/ghcr/fc6a1b03/paint-board:{tag}

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Paint Board
    summary: 汇集多种创意画笔和绘画效果的多端画板

